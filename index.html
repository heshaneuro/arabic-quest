  {id:10,ar:'باب',   t:'bāb',    en:'Door',     emoji:'🚪', theme:'minecraft', letters:[1,0]},
  {id:11,ar:'سهم',   t:'sahm',   en:'Arrow',    emoji:'🏹', theme:'minecraft', letters:[11,25,23]},
  {id:12,ar:'درع',   t:'dirʿ',   en:'Armor',    emoji:'🛡️', theme:'minecraft', letters:[7,9,17]},
  {id:13,ar:'صخر',   t:'ṣakhr',  en:'Rock',     emoji:'🪨', theme:'minecraft', letters:[13,6,9]},
  {id:14,ar:'نهر',   t:'nahr',   en:'River',    emoji:'🌊', theme:'minecraft', letters:[24,25,9]},

  {id:15,ar:'بيت',   t:'bayt',   en:'House',    emoji:'🏠', theme:'daily', letters:[1,27,2]},

const MATS=[
  {name:'Wood',     emoji:'🪵',color:'#C68642',minXP:0},
  {name:'Stone',    emoji:'🪨',color:'#909090',minXP:100},
  {name:'Iron',     emoji:'⚙️', color:'#D4D4D4',minXP:300},
  {name:'Gold',     emoji:'🥇',color:'#FFD700',minXP:600},
  {name:'Diamond',  emoji:'💎',color:'#4DE8E8',minXP:1000},
  {name:'Netherite',emoji:'🖤',color:'#BBBBBB',minXP:2000},
];

const C={
  bg:'#0b1219',panel:'rgba(0,0,0,0.82)',bD:'#3a4a5a',bL:'#6a8a9a',
  grass:'#4a7c3f',grassL:'#5fa34f',stone:'#555568',nether:'#cc4422',
  mine:'#8B6914',mineL:'#c49a1e',
  gold:'#FFD700',emerald:'#1aee6a',heart:'#ff3333',xp:'#7CFC00',
  diamond:'#3dd9d9',dim:'#8899aa',correct:'#2d6b28',wrong:'#7a1111',opt:'#15253a',
};

// ── HELPERS ───────────────────────────────────────────────────────
const getMat = xp=>{let m=MATS[0];for(const x of MATS)if(xp>=x.minXP)m=x;return m;};
const shuffle = a=>[...a].sort(()=>Math.random()-.5);
const wrongLetters = (l,n=3)=>shuffle(LETTERS.filter(x=>x.id!==l.id)).slice(0,n);
const wrongWords = (w,pool,n=3)=>shuffle(pool.filter(x=>x.id!==w.id)).slice(0,n);
const dk = h=>{const n=parseInt(h.replace('#',''),16);return `rgb(${Math.max(0,(n>>16)-55)},${Math.max(0,((n>>8)&255)-55)},${Math.max(0,(n&255)-55)})`;};

// ── WORD AVAILABILITY ─────────────────────────────────────────────
// A word is available if ALL its letters are in mastered set
const getAvailableWords = mastered =>
  WORDS.filter(w => w.letters.every(lid => mastered.includes(lid)));

// ── SPACED REPETITION ─────────────────────────────────────────────
const scoreItem = (id, stats, now) => {
  const s = stats[id];
  if (!s || s.total===0) return 100+Math.random()*20;
  const errorRate = s.wrong/s.total;
  const daysSince = s.lastSeen ? (now-s.lastSeen)/86400000 : 999;
  return (errorRate*60) + (Math.min(daysSince*15,60)) + (Math.random()*8);
};

const selectLetters = (mastered, stats, count=6) => {
  const now = Date.now();
  const scored = LETTERS.map(l=>({l,score:scoreItem(l.id,stats,now)}))
    .sort((a,b)=>b.score-a.score);
  const unmastered = scored.filter(x=>!mastered.includes(x.l.id));
  const masteredL  = scored.filter(x=> mastered.includes(x.l.id));
  const pool = [...unmastered.slice(0,4),...masteredL.slice(0,2)];
  if(pool.length<count) pool.push(...scored.slice(0,count-pool.length));
  return pool.slice(0,count).map(x=>x.l);
};

const selectWords = (mastered, wordStats, count=6) => {
  const now = Date.now();
  const available = getAvailableWords(mastered);
  if (available.length===0) return [];
  const scored = available.map(w=>({w,score:scoreItem(w.id,wordStats,now)}))
    .sort((a,b)=>b.score-a.score);
  return scored.slice(0,count).map(x=>x.w);
};

// ── LETTER EXERCISE BUILDER ───────────────────────────────────────
const buildLetterEx = (letter, form) => {
  const type=['name','arabic','form'][Math.floor(Math.random()*3)];
  if(type==='name'){
    const opts=shuffle([letter,...wrongLetters(letter)]).map(l=>({id:l.id,display:l.name,sub:`(${l.t})`,isArabic:false,isCorrect:l.id===letter.id}));
    return {type,letterId:letter.id,qAr:letter[form],qText:'What letter is this?',qSub:`${form} form`,opts};
  }
  if(type==='arabic'){
    const opts=shuffle([letter,...wrongLetters(letter)]).map(l=>({id:l.id,display:l.isolated,isArabic:true,isCorrect:l.id===letter.id}));
    return {type,letterId:letter.id,qAr:null,qText:'Find the letter:',qBig:`${letter.name} (${letter.t})`,qSub:letter.hint,opts};
  }
  const opts=FORM_NAMES.map(f=>({id:f,display:f[0].toUpperCase()+f.slice(1),isArabic:false,isCorrect:f===form}));
  return {type,letterId:letter.id,qAr:letter[form],qText:`Which form of "${letter.name}"?`,opts};
};

const buildLetterSession = (mastered, stats) => {
  const sel = selectLetters(mastered, stats, 6);
  const exs = [];
  sel.forEach(letter=>{
    const f1=FORM_NAMES[Math.floor(Math.random()*4)];
    const f2=FORM_NAMES[(FORM_NAMES.indexOf(f1)+2)%4];
    exs.push(buildLetterEx(letter,f1));
    exs.push(buildLetterEx(letter,f2));
  });
  return {exercises:shuffle(exs).slice(0,12), sessionItems:sel};
};

// ── WORD EXERCISE BUILDER ─────────────────────────────────────────
const buildWordEx = (word, pool) => {
  const type=['meaning','arabic','start'][Math.floor(Math.random()*3)];
  const wp = wrongWords(word, pool);
  if (type==='meaning') {
    const opts = shuffle([
      {id:word.id, display:word.en,  isArabic:false, isCorrect:true},
      ...wp.map(w=>({id:w.id, display:w.en, isArabic:false, isCorrect:false}))
    ]);
    return {type,wordId:word.id,qAr:word.ar,qText:'What does this word mean?',qSub:`/${word.t}/`,opts};
  }
  if (type==='arabic') {
    const opts = shuffle([
      {id:word.id, display:word.ar, isArabic:true, isCorrect:true},
      ...wp.map(w=>({id:w.id, display:w.ar, isArabic:true, isCorrect:false}))
    ]);
    return {type,wordId:word.id,qAr:null,qText:'Find the Arabic word:',qBig:`${word.emoji} ${word.en}`,qSub:`/${word.t}/`,opts};
  }
  // 'start' — which letter does this word START with?
  const startLetterId = word.letters[0];
  const startLetter   = LETTERS.find(l=>l.id===startLetterId);
  const wrongLtrs     = shuffle(LETTERS.filter(l=>l.id!==startLetterId)).slice(0,3);
  const opts = shuffle([
    {id:startLetter.id, display:startLetter.isolated, sub:startLetter.name, isArabic:true, isCorrect:true},
    ...wrongLtrs.map(l=>({id:l.id, display:l.isolated, sub:l.name, isArabic:true, isCorrect:false}))
  ]);
  return {type,wordId:word.id,qAr:word.ar,qText:'Which letter does this start with?',qSub:`${word.emoji} ${word.en}`,opts};
};

const buildWordSession = (mastered, wordStats) => {
  const sel = selectWords(mastered, wordStats, 6);
  if (sel.length===0) return {exercises:[], sessionItems:[]};
  const pool = getAvailableWords(mastered);
  const exs = [];
  sel.forEach(word=>{
    exs.push(buildWordEx(word, pool.length>=4?pool:[...pool,...WORDS].slice(0,4)));
    exs.push(buildWordEx(word, pool.length>=4?pool:[...pool,...WORDS].slice(0,4)));
  });
  return {exercises:shuffle(exs).slice(0,12), sessionItems:sel};
};

// ── LOCAL STORAGE ─────────────────────────────────────────────────
const defaultPlayer = ()=>({xp:0,hearts:5,emeralds:0,streak:0,mastered:[],dailyDone:false,placementDone:false,lastPlayDate:null});
const loadSave = ()=>{
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return {player:defaultPlayer(),letterStats:{},wordStats:{}};
    const s=JSON.parse(raw);
    return {player:{...defaultPlayer(),...s.player},letterStats:s.letterStats||{},wordStats:s.wordStats||{}};
  }catch(e){return {player:defaultPlayer(),letterStats:{},wordStats:{}};}
};
const writeSave=(player,letterStats,wordStats)=>{
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({player,letterStats,wordStats}));}catch(e){}
};

// ── STYLE HELPERS ─────────────────────────────────────────────────

  return (
    <div style={{...pn({marginBottom:'14px'})}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>

        <div style={{textAlign:'center'}}><div style={{color:'#FF8C00',fontSize:'9px'}}>🔥 {player.streak}</div><div style={{color:C.dim,fontSize:'6px'}}>streak</div></div>

      </div>
    </div>
  );
};

// ── HOME ──────────────────────────────────────────────────────────
function Home({player, onPlace, onContinue}) {
  const mat = getMat(player.xp);
  const isNew = !player.placementDone;
  return (

// ── PLACEMENT ─────────────────────────────────────────────────────
function Placement({onDone}) {
  const [qs]=useState(()=>shuffle(LETTERS).map(letter=>{
    const form=FORM_NAMES[Math.floor(Math.random()*4)];
    const opts=shuffle([letter,...wrongLetters(letter)]).map(l=>({id:l.id,display:l.name,sub:l.t,isCorrect:l.id===letter.id}));
    return {letter,form,opts};
  }));
  const [idx,setIdx]=useState(0);
  const [results,setResults]=useState({});
  const [sel,setSel]=useState(null);
  const [fb,setFb]=useState(null);
  const q=qs[idx];
  const pick=optId=>{
    if(fb)return;
    const ok=q.opts.find(o=>o.id===optId)?.isCorrect||false;
    setSel(optId);setFb(ok?'ok':'no');
    const nr={...results,[q.letter.id]:ok};setResults(nr);
    setTimeout(()=>{if(idx+1>=qs.length)onDone(nr);else{setIdx(i=>i+1);setSel(null);setFb(null);}},700);
  };
  return (
    <div style={{minHeight:'100vh',background:C.bg,padding:'18px',fontFamily:PX,display:'flex',flexDirection:'column'}}>
      <div style={{marginBottom:'14px'}}>
        <div style={{color:C.gold,fontSize:'9px',marginBottom:'6px'}}>📋 PLACEMENT TEST</div>
        <div style={{color:C.dim,fontSize:'6px',marginBottom:'6px'}}>Letter {idx+1} of {qs.length} — all 28 letters</div>
        <PBar value={idx} max={qs.length} color={C.gold} h={7}/>
      </div>
      <div className="slide-up" style={{...pn({flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',marginBottom:'16px',minHeight:'180px'})}}>
        <div style={{color:C.dim,fontSize:'7px',marginBottom:'14px',textAlign:'center'}}>Which letter is this? <span style={{color:'#445'}}>({q.form} form)</span></div>
        <div style={{fontSize:'86px',fontFamily:AR,color:'white',lineHeight:1,textAlign:'center',filter:fb==='ok'?'drop-shadow(0 0 14px #4de8e8)':'none',transition:'filter .3s'}}>{q.letter[q.form]}</div>
        <div style={{color:'#2a3a2a',fontSize:'7px',marginTop:'12px'}}>Tap the correct name</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
        {q.opts.map(opt=>{
          let bg=C.opt;if(fb){if(opt.isCorrect)bg=C.correct;else if(opt.id===sel)bg=C.wrong;}
          return(
            <button key={opt.id} onClick={()=>pick(opt.id)} style={bt(bg,{padding:'14px 8px',lineHeight:1.8})}>
              <div style={{fontSize:'8px'}}>{opt.display}</div>
              <div style={{fontSize:'6px',color:'rgba(255,255,255,0.4)',marginTop:'2px'}}>({opt.sub})</div>
            </button>
          );
        })}
      </div>
      <div style={{marginTop:'14px',color:'#1a2a1a',fontSize:'6px',textAlign:'center'}}>This personalizes your learning journey</div>
    </div>
  );
}

// ── GENERIC LESSON (letters + words share this) ───────────────────
function Lesson({player, exercises, zone, onDone, onBack}) {
  const [idx,setIdx]=useState(0);
  const [hearts,setHearts]=useState(player.hearts);
  const [xp,setXp]=useState(0);
  const [em,setEm]=useState(0);
  const [correct,setCorrect]=useState(0);
  const [sel,setSel]=useState(null);
  const [fb,setFb]=useState(null);
  const [secs,setSecs]=useState(0);
  const [done,setDone]=useState(false);
  const [learnedIds,setLearnedIds]=useState([]);
  const [bonus,setBonus]=useState(false);
  const [statsDelta,setStatsDelta]=useState({});

  useEffect(()=>{if(done)return;const t=setInterval(()=>setSecs(s=>s+1),1000);return()=>clearInterval(t);},[done]);
  const ex=exercises[idx];
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const itemId = ex ? (ex.letterId!==undefined ? ex.letterId : ex.wordId) : null;

  const pick=optId=>{
    if(fb||done)return;
    const ok=ex.opts.find(o=>o.id===optId)?.isCorrect||false;
    setSel(optId);setFb(ok?'ok':'no');
    setStatsDelta(prev=>{const cur=prev[itemId]||{correct:0,wrong:0};return {...prev,[itemId]:{correct:cur.correct+(ok?1:0),wrong:cur.wrong+(ok?0:1)}};});
    let nh=hearts,nc=correct,nx=xp,ne=em;
    if(ok){nc++;nx+=10;setLearnedIds(p=>[...new Set([...p,itemId])]);if(nc%5===0){ne+=2;setBonus(true);setTimeout(()=>setBonus(false),1100);}}
    else{nh=Math.max(0,hearts-1);}
    setHearts(nh);setCorrect(nc);setXp(nx);setEm(ne);
    const over=nh===0||(idx+1)>=exercises.length;
    setTimeout(()=>{if(over)setDone(true);else{setIdx(i=>i+1);setSel(null);setFb(null);}},900);
  };

  if(done) return <Complete xp={xp} em={em} correct={correct} total={idx+1} secs={secs} hearts={hearts} statsDelta={statsDelta} zone={zone} onContinue={()=>onDone({xp,em,learnedIds,secs,statsDelta})}/>;
  if(!ex)return null;

  const zoneColor = zone==='mine'?C.mineL:C.grassL;
  const zoneBg    = zone==='mine'?'linear-gradient(180deg,#1a1000,#0e0800)':'linear-gradient(180deg,#0c1f0c,#080f08)';

  return (
    <div style={{minHeight:'100vh',background:zoneBg,padding:'14px',fontFamily:PX,display:'flex',flexDirection:'column',position:'relative'}}>
      {bonus&&<div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',background:'rgba(0,0,0,0.95)',border:`3px solid ${C.emerald}`,padding:'16px 24px',zIndex:100,textAlign:'center',fontSize:'10px',color:C.emerald}}>💎 +2 EMERALDS!</div>}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
        <button onClick={onBack} style={{background:'none',border:'none',color:'#444',fontSize:'22px',cursor:'pointer',padding:'0 4px'}}>←</button>
        <Hearts cur={hearts} max={5}/>
        <div style={{color:C.gold,fontSize:'7px'}}>+{xp} XP</div>
      </div>
      <div style={{marginBottom:'10px'}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px'}}>
          <span style={{color:C.dim,fontSize:'6px'}}>{idx+1}/{exercises.length} questions</span>
          <span style={{color:secs>=900?zoneColor:C.dim,fontSize:'6px'}}>⏱ {fmt(secs)} {secs>=900?'✅':'/ 15:00'}</span>
        </div>
        <PBar value={idx} max={exercises.length} h={6} color={zoneColor}/>
        <div style={{marginTop:'3px'}}><PBar value={Math.min(secs,900)} max={900} color='#FF8C00' h={4}/></div>
      </div>
      <div style={{...pn({flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',marginBottom:'14px',minHeight:'200px'})}}>
        <div style={{color:C.dim,fontSize:'7px',marginBottom:'12px',textAlign:'center'}}>{ex.qText}</div>
        {ex.qAr&&<div style={{fontSize:'72px',fontFamily:AR,color:'white',lineHeight:1,textAlign:'center',filter:`drop-shadow(0 0 ${fb==='ok'?'18px #4a7c3f':fb==='no'?'18px #7a1111':'0px transparent'})`,transition:'filter .3s'}}>{ex.qAr}</div>}
        {ex.qBig&&<div style={{fontSize:'14px',color:C.gold,marginBottom:'8px',textAlign:'center'}}>{ex.qBig}</div>}
        {ex.qSub&&<div style={{color:'#445',fontSize:'6px',marginTop:'8px',textAlign:'center'}}>{ex.qSub}</div>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
        {ex.opts.map(opt=>{
          let bg=C.opt;if(fb){if(opt.isCorrect)bg=C.correct;else if(opt.id===sel)bg=C.wrong;}
          return(
            <button key={String(opt.id)} onClick={()=>pick(opt.id)} style={bt(bg,{padding:'12px 8px',display:'flex',flexDirection:'column',alignItems:'center',gap:'4px',transition:'background .2s'})}>
              {opt.isArabic?<span style={{fontFamily:AR,fontSize:'32px',lineHeight:1}}>{opt.display}</span>:<span style={{fontSize:'7px'}}>{opt.display}</span>}
              {opt.sub&&<span style={{fontSize:'5px',color:'rgba(255,255,255,0.35)'}}>{opt.sub}</span>}
            </button>
          );
        })}
      </div>
      {fb&&<div style={{marginTop:'8px',padding:'8px',background:fb==='ok'?'rgba(45,107,40,.5)':'rgba(122,17,17,.5)',border:`2px solid ${fb==='ok'?C.grassL:'#aa2222'}`,color:'white',fontSize:'7px',textAlign:'center'}}>
        {fb==='ok'?`✅ Correct! +10 XP`:`❌ Answer: ${ex.opts.find(o=>o.isCorrect)?.display||''}`}
      </div>}
    </div>
  );
}

// ── COMPLETE ──────────────────────────────────────────────────────
function Complete({xp,em,correct,total,secs,hearts,statsDelta,zone,onContinue}) {
  const acc=total>0?Math.round((correct/total)*100):0;
  const fmt=s=>`${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`;
  const items = zone==='mine'
    ? Object.keys(statsDelta).map(id=>WORDS.find(w=>w.id===Number(id))).filter(Boolean)
    : Object.keys(statsDelta).map(id=>LETTERS.find(l=>l.id===Number(id))).filter(Boolean);
  return (
    <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#060618,#12062a)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'20px',fontFamily:PX}}>
      <div className="pop" style={{fontSize:'52px',marginBottom:'12px'}}>{acc>=80?'🏆':acc>=50?'⭐':'💪'}</div>
      <div style={{color:C.gold,fontSize:'13px',textShadow:'2px 2px 0 #000',marginBottom:'6px',textAlign:'center'}}>QUEST COMPLETE!</div>
      <div style={{color:C.dim,fontSize:'7px',marginBottom:'4px',textAlign:'center'}}>{zone==='mine'?'⛏️ THE MINE':'🏡 THE VILLAGE'}</div>
      {secs>=900?<div style={{color:C.grassL,fontSize:'7px',marginBottom:'20px',textAlign:'center'}}>🔥 15-MINUTE DAILY MISSION DONE!</div>
        :<div style={{color:C.dim,fontSize:'7px',marginBottom:'20px',textAlign:'center'}}>Aim for 15 min next session!</div>}
      <div style={{...pn({width:'100%',maxWidth:'320px',marginBottom:'14px'})}}>
        {[['⭐ XP EARNED',`+${xp}`,C.xp],['💎 EMERALDS',`+${em}`,C.emerald],['🎯 ACCURACY',`${acc}%`,acc>=80?C.grassL:C.gold],
          ['✅ CORRECT',`${correct}/${total}`,C.diamond],['⏱ TIME',fmt(secs),C.dim],['❤️ HEARTS',`${hearts}/5`,C.heart]]
          .map(([label,val,col])=>(
          <div key={label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'9px'}}>
            <span style={{color:C.dim,fontSize:'6px'}}>{label}</span>
            <span style={{color:col,fontSize:'8px'}}>{val}</span>
          </div>
        ))}
      </div>
      {items.length>0&&(
        <div style={{...pn({width:'100%',maxWidth:'320px',marginBottom:'14px'})}}>
          <div style={{color:C.diamond,fontSize:'6px',marginBottom:'8px'}}>✨ PRACTICED THIS SESSION</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
            {items.map(item=>(
              <div key={item.id} style={{background:'rgba(0,0,0,0.4)',border:`1px solid ${C.bD}`,padding:'4px 8px',textAlign:'center'}}>
                <span style={{fontFamily:AR,fontSize:'20px',color:'white'}}>{item.ar}</span>
                <div style={{fontSize:'5px',color:C.dim,marginTop:'2px'}}>{item.en||item.name}</div>
              </div>
            ))}
          </div>
        </div>
      )}
      <button style={bt(C.grass,{maxWidth:'320px',fontSize:'8px'})} onClick={onContinue}>🗺️ BACK TO MAP</button>
      <div style={{marginTop:'10px',color:'#1a2a1a',fontSize:'6px',textAlign:'center'}}>💾 Progress saved! Return tomorrow for your streak 🔥</div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────
function App() {
  const saved = loadSave();
  const [player,     setPlayer]     = useState(saved.player);
  const [letterStats,setLetterStats]= useState(saved.letterStats);
  const [wordStats,  setWordStats]  = useState(saved.wordStats);
  const [screen,     setScreen]     = useState('home');
  const [sessionItems,setSessionItems]=useState([]);
  const [exercises,  setExercises]  = useState([]);
  const [activeZone, setActiveZone] = useState('village');

  useEffect(()=>{ writeSave(player,letterStats,wordStats); },[player,letterStats,wordStats]);

  // Daily reset
  useEffect(()=>{
    const today=new Date().toDateString();
    if(player.lastPlayDate&&player.lastPlayDate!==today){
      const yesterday=new Date(Date.now()-86400000).toDateString();
      setPlayer(p=>({...p,dailyDone:false,streak:p.lastPlayDate===yesterday?p.streak:0,lastPlayDate:today}));
    }
  },[]);

  const handlePlacement = results => {
    const known=Object.entries(results).filter(([,v])=>v).map(([k])=>Number(k));
    const newStats={};
    Object.entries(results).forEach(([id,ok])=>{newStats[Number(id)]={total:1,correct:ok?1:0,wrong:ok?0:1,lastSeen:Date.now()};});
    setPlayer(p=>({...p,mastered:known,xp:known.length*8,emeralds:Math.floor(known.length/4),placementDone:true}));
    setLetterStats(newStats);
    setScreen('map');
  };

  const startVillage = () => {
    const {exercises:exs,sessionItems:si}=buildLetterSession(player.mastered,letterStats);
    setExercises(exs); setSessionItems(si); setActiveZone('village');
    setScreen('letter-intro');
  };

  const startMine = () => {
    const {exercises:exs,sessionItems:si}=buildWordSession(player.mastered,wordStats);
    if(exs.length===0){alert('Keep mastering letters to unlock more words!');return;}
    setExercises(exs); setSessionItems(si); setActiveZone('mine');
    setScreen('word-intro');
  };

  const handleDone = ({xp,em,learnedIds,secs,statsDelta}) => {
    if(activeZone==='village'){
      setLetterStats(prev=>{
        const next={...prev};
        Object.entries(statsDelta).forEach(([id,delta])=>{
          const cur=next[Number(id)]||{total:0,correct:0,wrong:0};
          next[Number(id)]={total:cur.total+delta.correct+delta.wrong,correct:cur.correct+delta.correct,wrong:cur.wrong+delta.wrong,lastSeen:Date.now()};
        });
        return next;
      });
      const newMastered=[...new Set([...player.mastered,...learnedIds])].filter(id=>{
        const s=letterStats[id];
        if(!s||s.total<3)return learnedIds.includes(id);
        return(s.correct/s.total)>=0.7;
      });
      const today=new Date().toDateString();
      setPlayer(p=>({...p,xp:p.xp+xp,emeralds:p.emeralds+em,hearts:5,mastered:newMastered,streak:p.dailyDone?p.streak:p.streak+1,dailyDone:true,lastPlayDate:today}));
    } else {
      setWordStats(prev=>{
        const next={...prev};
        Object.entries(statsDelta).forEach(([id,delta])=>{
          const cur=next[Number(id)]||{total:0,correct:0,wrong:0};
          next[Number(id)]={total:cur.total+delta.correct+delta.wrong,correct:cur.correct+delta.correct,wrong:cur.wrong+delta.wrong,lastSeen:Date.now()};
        });
        return next;
      });
      const today=new Date().toDateString();
      setPlayer(p=>({...p,xp:p.xp+xp,emeralds:p.emeralds+em,hearts:5,streak:p.dailyDone?p.streak:p.streak+1,dailyDone:true,lastPlayDate:today}));
    }
    setScreen('map');
  };

  const handleZone = z => {
    if(z==='village') startVillage();
    else if(z==='mine') startMine();
  };

  return (
    <div style={{maxWidth:'430px',margin:'0 auto',minHeight:'100vh'}}>
      {screen==='home'        && <Home player={player} onPlace={()=>setScreen('placement')} onContinue={()=>setScreen('map')}/>}
      {screen==='placement'   && <Placement onDone={handlePlacement}/>}
      {screen==='map'         && <WorldMap player={player} letterStats={letterStats} wordStats={wordStats} onZone={handleZone}/>}
      {screen==='letter-intro'&& <LetterIntro sessionItems={sessionItems} onDone={()=>setScreen('lesson')}/>}
      {screen==='word-intro'  && <WordIntro sessionItems={sessionItems} mastered={player.mastered} onDone={()=>setScreen('lesson')}/>}
      {screen==='lesson'      && <Lesson player={player} exercises={exercises} zone={activeZone} onDone={handleDone} onBack={()=>setScreen('map')}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
